{% macro toast(message) %}
{% if message.url %}
<a href="{{message.url}}">
{% endif %}
  <li
    class="notification is-{{message.category}}"
    role="alert"
    x-data="{ open: true }"
    @click="open = ! open"
    x-show="open"
    x-transition
  >
    {% if message.url %}
    <span class="group">
      <span class="icon is-{{message.category}} is-strong"><i class="ti ti-{% if message.ti %}{{message.ti}}{% else %}external-link{% endif %}"></i></span>
      <span>{{message.message}}</span>
    </span>
    {% else %}
    {{message.message}}
    {% endif %}
  </li>
{% if message.url %}
</a>
{% endif %}
{% endmacro %}

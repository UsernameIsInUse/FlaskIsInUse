<header class="header">
  <nav class="nav is-translucent">
    <div class="nav-item">
      <button
      class="button is-ghost is-icon"
      aria-label="Toggle Sidebar"
      @click="sidebarOpen = !sidebarOpen">
      <span class="icon"><i class="ti ti-layout-sidebar-filled"></i></span></button>
      <a href="{{url_for('views.index')}}" class="logo" @click="current = 'home'"><span>Flask</span>IsInUse</a>
    </div>
    <div class="nav-item">
      {% if current_user.is_authenticated %}
      <a class="button is-ghost" href="{{url_for('views.user_settings')}}">Settings</a>
      {% else %}
      <a class="button is-ghost" href="{{url_for('views.register')}}">Register</a>
      <a class="button is-ghost" href="{{url_for('views.login')}}">Login</a>
      {% endif %}
    </div>
  </nav>
</header>



<!DOCTYPE html>
<html lang="en" data-theme="" class="default">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <link rel="preconnect" href="https://cdn.jsdelivr.net/" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    {% block pre %}{% endblock %}

    <link rel="stylesheet" type="text/css"  href="{{ url_for('static', filename='main.css') }}">
    <link rel="stylesheet" type="text/css"  href="{{ url_for('static', filename='integrations.css') }}">
    <link rel="stylesheet" type="text/css"  href="{{ url_for('static', filename='overrides.css') }}">

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Commissioner:wght@100..900&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
    
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.8/dist/htmx.min.js"></script>

    {% block alpine %}{% endblock %}
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    
    <link rel="icon" href="{{ url_for('static', filename='img/favicon.png') }}" type="image/png">
    <link rel="shortcut icon" href="{{ url_for('static', filename='img/favicon.png') }}" type="image/png">

    <meta name="description" content="Template description.">
    <meta name="theme-color" content="#000000">
    {% block meta %}
      <meta property="og:title" content="{{app_name}}">
      <meta property="og:description" content="Template description.">
      <meta property="og:image" content="{{url_for('static',filename='img/social.png', _external=True)}}">
      <meta name="twitter:title" content="{{app_name}}">
      <meta name="twitter:description" content="Template description.">
    {% endblock %}
    <meta property="og:type" content="website">
    <meta property="og:url" content="{{ url_for(request.endpoint, _external=True, **request.view_args) }}">
    <link rel="canonical" href="{{ url_for(request.endpoint, _external=True, **request.view_args) }}">
    <meta name="twitter:card" content="summary_large_image">

    {% block head %}{% endblock %}

    <title>{% block title %} {% endblock %}{{app_name}}</title>

    <script> // Cookies
      function setCookie(cname, cvalue, exdays) {
        const d = new Date();
        d.setTime(d.getTime() + (exdays*24*60*60*1000));
        let expires = "expires="+ d.toUTCString();
        document.cookie = cname + "=" + cvalue + ";" + expires + ";path=/";
      }

      function getCookie(cname) {
        let name = cname + "=";
        let decodedCookie = decodeURIComponent(document.cookie);
        let ca = decodedCookie.split(';');
        for(let i = 0; i <ca.length; i++) {
          let c = ca[i];
          while (c.charAt(0) == ' ') {
            c = c.substring(1);
          }
          if (c.indexOf(name) == 0) {
            return c.substring(name.length, c.length);
          }
        }
        return null;
      }
      
      function checkCookie(cname) {
        let cookie = getCookie(cname);
        if (cookie != null) {
          return true
        } else {
          return false
        }
      }
    </script>

    <script> // Ajax
      async function ajax(url, data = {}, method = "POST", csrfToken = null) {
        console.log(url)
        console.log(data)
        console.log(method)
        console.log(csrfToken)
        try {
          const response = await fetch(url, {
            method,
            headers: {
              "Content-Type": "application/json",
              "X-CSRFToken": csrfToken,
            },
            credentials: "same-origin",
            body: method.toUpperCase() !== "GET" ? JSON.stringify(data) : undefined
          });

          const responseData = await response.json();
          
          if (response.ok) {
            notify(responseData.message, response.ok ? "info" : "warning");
          } else {
            throw new Error();
          };
        } catch (error) {
          notify("Something went wrong.", "danger");
        };
      };

      document.addEventListener('submit', async function(e) {
        const form = e.target.closest("form[data-ajax]");
        if (!form) return;
        e.preventDefault();
        const formData = Object.fromEntries(new FormData(form));
        const csrfToken = formData.csrf_token || "";
        await ajax(form.action, formData, form.method.toUpperCase(), csrfToken)
      })
    </script>
  </head>

  <body
    x-data="{ theme: '', scheme: '', sidebarOpen: {% if sidebar %}true{% else %}false{% endif %}, sidebarFull: false, initialized: false }"
    x-init="sidebarFull = window.innerWidth < 608;
            if ( sidebarOpen && window.innerWidth < 608 ) { sidebarOpen = false };
            $nextTick(() => initialized = true);
            if (theme === '' && checkCookie('theme') ) { theme = getCookie('theme') } else if (theme === '') { theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; };
            if (scheme === '' && checkCookie('scheme') ) { scheme = getCookie('scheme') } else if (scheme === '') { scheme = 'default' }"
    @resize.window="sidebarFull = window.innerWidth < 608"
    :data-theme="theme"
    :data-scheme="scheme"
  >
    <script>0</script>

    <ul
      id="notifications"
      class="notifications"
      x-data="{
        notifs: [
          {% with messages = get_flashy_messages() %}
          {% if messages %}
          {% for message in messages %}
          {% if not message.url %}
            { id: {{ loop.index }}, message: `{{ message.message }}`, color: `{{ message.category }}`, url: `{{ message.url }}`{% if message.ti %}, ti: `{{ message.ti }}`{% endif %} }
          {% endif %}
          {% endfor %}
          {% endif %}
          {% endwith %}
        ],
        linkNotifs: [
          {% with messages = get_flashy_messages() %}
          {% if messages %}
          {% for message in messages %}
          {% if message.url %}
            { id: {{ loop.index }}, message: `{{ message.message }}`, color: `{{ message.category }}`, url: `{{ message.url }}`{% if message.ti %}, ti: `{{ message.ti }}`{% endif %} }
          {% endif %}
          {% endfor %}
          {% endif %}
          {% endwith %}
        ],
        }"
    >
      <template x-for="notif in linkNotifs" :key="notif.id" >
        <a :href="notif.url">
          <li
            class="notification"
            :class="`is-${notif.color}`"
            role="alert"
          >
            <span class="group is-flex-flow-row is-align-start">
              <span class="icon is-strong"><i class="ti" :class="'ti' in notif ? `ti-${notif.ti}` : 'ti-external-link'"></i></span>
              <span x-text="notif.message"></span>
            </span>
          </li>
        </a>
      </template>
      <template x-for="notif in notifs" :key="notif.id" >
        <li
          class="notification"
          :class="`is-${notif.color}`"
          role="alert"
          x-text="notif.message"
          x-data="{ open: true }"
          @click="open = ! open"
          x-show="open"
          x-transition
          x-transition:leave.duration.500ms
        ></li>
      </template>
      <script>
        function notify(message, color, url=null) {
          const { notifs, linkNotifs } = Alpine.$data(
            document.getElementById("notifications")
          );
          const list = url ? linkNotifs : notifs;
          const last = list[list.length - 1];

          list.push({
            id: last ? last.id + 1 : 1,
            message,
            color,
            ...(url ? { url } : {}),
          });
        }
      </script>
    </ul>

    <span class="chip is-quiet is-info version">{{version}}</span>

    {% include "nav.html" %}

    <main
      class='has-sidebar {% if sidebar %}open{% endif %}'
      :class="{ 'open': sidebarOpen, 'full': sidebarFull, 'no-transitions': !initialized }"
    >
      {% include "sidebar.html" %}

      <div class="main">
        {% block content %}{% endblock %}
      </div>
    </main>

  </body>
</html>
